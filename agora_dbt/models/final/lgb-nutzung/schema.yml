version: 2

models:
  - name: final_alkis_parcels_lgb_result
    description: "Final ALKIS parcels dataset enriched with LGB attributes."
    columns:
      - name: id
        description: "Unique identifier for the ALKIS parcel."
        tests:
          - unique
          - not_null
      - name: ZAE
        description: "ALKIS parcel number."
      - name: Shape_Area
        description: "Total area of the parcel."
      - name: lgb_art
        description: "Array of unique LGB classifications for each parcel."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "array_length(lgb_art, 1) > 0"

      - name: lgb_typ
        description: "Array of unique LGB types corresponding to lgb_art."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "array_length(lgb_typ, 1) > 0"
      - name: data_version
        description: "Timestamp of when the dataset was processed."

  - name: final_alkis_nutzung_result
    description: "Final ALKIS parcels dataset enriched with Nutzung + LGB attributes."
    columns:
      - name: id
        description: "Unique identifier for the ALKIS parcel."
      - name: ZAE
        description: "ALKIS parcel number."
      - name: Shape_Area
        description: "Total area of the parcel."
      - name: nutzart_list
        description: "Array of Nutzung types that intersect with the parcel."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "array_length(nutzart_list, 1) > 0"


      - name: data_version
        description: "Timestamp of when the dataset was processed."

  - name: final_parcel_poi_distance
    description: "Each parcel enriched with nearest POI distances"
    columns:
      - name: dist_airport
        tests:
          - not_null
      - name: dist_bus_stop
        tests:
          - not_null
      - name: dist_fire_departments
        tests:
          - not_null
      - name: dist_hospitals
        tests:
          - not_null
      - name: dist_kindergarten
        tests:
          - not_null
      - name: dist_pharmacies
        tests:
          - not_null
      - name: dist_supermarket
        tests:
          - not_null
      - name: dist_train_station
        tests:
          - not_null
  - name: final_parcel_grz_analysis
    description: >
      Final output for parcel-level GRZ analysis. Merges ALKIS parcel data, calculated GRZ (grz_alkis), 
      planned GRZ from xplanning data (x_grz), and computes potential_grz. Includes list of building IDs 
      contributing to the calculated GRZ.
    columns:
      - name: parcel_uuid
        description: "Unique identifier for the parcel"
        tests:
          - not_null
          - unique

      - name: grz_alkis
        description: "Calculated GRZ value based on actual building footprints intersecting each parcel"
        tests:
          - dbt_utils.expression_is_true:
              expression: "grz_alkis IS NULL OR (grz_alkis >= 0 AND grz_alkis <= 2)"

      - name: grz_xplanung
        description: "Planned GRZ value from xplanning polygon"
        tests:
          - dbt_utils.expression_is_true:
              expression: "x_grz IS NULL OR (x_grz >= 0 AND x_grz <= 2)"

      - name: grz_potential
        description: "Difference between planned GRZ (x_grz) and actual calculated GRZ (grz_alkis)"

      - name: xplanung_id
        description: "ID of the xplanning polygon that contains the parcel's center point"

      - name: buildings
        description: >
          Array of building IDs that contributed to GRZ calculation.
          May be NULL or empty if the parcel contains no intersecting buildings.
